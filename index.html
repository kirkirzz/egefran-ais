<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Cahier de français — тренажёр ЕГЭ</title>
<style>
  :root{
    color-scheme: light;
    --paper: #fbfbfa;
    --paper-line: #e6e8ee;
    --ink: #10173a;
    --ink-soft: #4a5578;
    --navy: #17275c;
    --navy-soft: #2c3d7a;
    --red: #b3272d;
    --red-soft: #e2a2a0;
    --green: #2f6b46;
    --card-shadow: 0 18px 40px rgba(16,23,58,0.10);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html {
    background: var(--paper);
    color-scheme: light;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    min-height: 100%;
  }

  body {
    background-image: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 37px,
      var(--paper-line) 38px
    );
    padding: 0 16px 64px;
  }

  .flag-bar {
    height: 5px;
    margin: 0 -16px 24px;
    background: linear-gradient(
      to right,
      var(--navy) 0%, var(--navy) 33.33%,
      #ffffff 33.33%, #ffffff 66.66%,
      var(--red) 66.66%, var(--red) 100%
    );
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    padding-top: 18px;
    flex-wrap: wrap;
  }

  header.top h1 {
    font-size: 1.3rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.01em;
    color: var(--navy);
  }

  header.top .stats {
    font-size: 0.95rem;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .sheet {
    position: relative;
    background: #ffffff;
    border-radius: 4px;
    box-shadow: var(--card-shadow);
    padding: 28px 22px 26px 34px;
    border: 1px solid #e3e6f0;
    overflow: hidden;
  }

  .sheet::before {
    content: "";
    position: absolute;
    left: 20px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--red-soft);
    opacity: 0.55;
  }

  .progressbar {
    height: 6px;
    background: var(--paper-line);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progressbar > div {
    height: 100%;
    background: var(--navy-soft);
    width: 0%;
    transition: width 0.35s ease;
  }

  .theme-tag {
    display: inline-block;
    font-size: 0.78rem;
    color: var(--navy-soft);
    border: 1px solid var(--paper-line);
    border-radius: 999px;
    padding: 3px 12px;
    margin-bottom: 16px;
    background: #f2f4fb;
  }

  .sentence {
    font-size: 1.28rem;
    line-height: 1.65;
    margin-bottom: 6px;
  }

  .blank {
    display: inline-block;
    min-width: 90px;
    border-bottom: 2px solid var(--ink);
    text-align: center;
    padding: 0 4px;
  }

  .given-word {
    display: inline-block;
    margin-top: 4px;
    margin-bottom: 20px;
    border: 1.5px solid var(--ink);
    border-radius: 3px;
    padding: 4px 12px;
    font-variant: small-caps;
    letter-spacing: 0.03em;
    font-size: 1.05rem;
    background: #f2f4fb;
  }

  form.answer-row {
    display: flex;
    gap: 10px;
    margin-top: 4px;
    flex-wrap: wrap;
  }

  input[type="text"] {
    flex: 1 1 200px;
    font-size: 17px;
    font-family: inherit;
    color: var(--ink);
    padding: 12px 14px;
    min-height: 44px;
    border: 2px solid var(--navy);
    border-radius: 6px;
    background: #ffffff;
    -webkit-text-fill-color: var(--ink);
  }
  input[type="text"]:focus {
    outline: 3px solid var(--navy-soft);
    outline-offset: 1px;
  }
  input[type="text"]::placeholder {
    color: #8a90a8;
  }

  button {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    min-height: 44px;
    min-width: 44px;
    padding: 10px 20px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    touch-action: manipulation;
  }

  button.primary {
    background: var(--navy);
    color: #ffffff;
  }
  button.primary:active { background: #0c1740; }

  button.secondary {
    background: transparent;
    color: var(--navy);
    border: 2px solid var(--navy);
  }
  button.secondary:active { background: #eef1fa; }

  select.theme-select {
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    background: #ffffff;
    border: 2px solid var(--navy);
    border-radius: 6px;
    padding: 9px 10px;
    min-height: 44px;
  }

  .feedback {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 6px;
    font-size: 1.02rem;
    line-height: 1.55;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct {
    background: #eaf3ec;
    border: 1.5px solid var(--green);
    color: #294f34;
  }
  .feedback.wrong {
    background: #f8ecea;
    border: 1.5px solid var(--red);
    color: var(--red);
  }
  .feedback .margin-note {
    display: block;
    margin-top: 8px;
    font-size: 0.92rem;
    color: var(--ink-soft);
    font-style: italic;
  }

  .next-row {
    margin-top: 18px;
    display: none;
  }
  .next-row.show { display: block; }

  .summary h2 {
    font-size: 1.25rem;
    margin-top: 0;
  }
  .summary ul {
    padding-left: 20px;
    margin: 12px 0 22px;
  }
  .summary li {
    margin-bottom: 6px;
  }
  .summary .score {
    font-size: 2.1rem;
    font-weight: 700;
    color: var(--ink);
    margin: 4px 0 2px;
  }
  .summary .score-label {
    color: var(--ink-soft);
    margin-bottom: 18px;
  }

  .button-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 8px;
  }

  .setup-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 18px;
  }
  .setup-row label {
    font-size: 0.92rem;
    color: var(--ink-soft);
  }

  footer.hint {
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.85rem;
    margin-top: 20px;
  }

  @media (max-width: 420px) {
    .sentence { font-size: 1.15rem; }
    .sheet { padding: 22px 16px 22px 26px; }
  }
</style>
</head>
<body>
<div class="flag-bar"></div>
<div class="wrap">
  <header class="top">
    <h1>Cahier de français</h1>
    <div class="stats" id="statsLine">0 / 0 · верно 0</div>
  </header>

  <div class="sheet">
    <div class="setup-row" id="setupRow">
      <label for="themeFilter">Тема:</label>
      <select class="theme-select" id="themeFilter">
        <option value="">Все темы (354 задания)</option>
      </select>
    </div>

    <div class="progressbar"><div id="progressFill"></div></div>

    <div id="quizArea">
      <div class="theme-tag" id="themeTag"></div>
      <div class="sentence" id="sentenceText"></div>
      <div class="given-word" id="givenWord"></div>

      <form class="answer-row" id="answerForm">
        <input type="text" id="answerInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Впишите форму слова">
        <button type="submit" class="primary" id="submitBtn">Ответить</button>
      </form>

      <div class="feedback" id="feedback"></div>

      <div class="next-row" id="nextRow">
        <button type="button" class="primary" id="nextBtn">Далее</button>
      </div>
    </div>

    <div class="summary" id="summaryArea" style="display:none;">
      <h2>Занятие завершено</h2>
      <div class="score" id="scoreText">0 / 0</div>
      <div class="score-label">правильных ответов с первой попытки</div>
      <div id="weakThemes"></div>
      <div class="button-row">
        <button type="button" class="primary" id="restartAllBtn">Начать заново (все задания)</button>
        <button type="button" class="secondary" id="restartWeakBtn">Повторить только слабые темы</button>
      </div>
    </div>
  </div>

  <footer class="hint">При ошибке правильный ответ показывается сразу, а дальше добавляется ещё пара заданий на ту же тему. Можно выбрать одну тему для отработки — в выпадающем списке сверху.</footer>
</div>

    {s:"Il ___ très malade.", w:"TOMBER", a:"est tombé", t:"Passé composé"},
    {s:"Voici des ___.", w:"OISEAU", a:"oiseaux", t:"Множественное число существительных"},
    {s:"Sont vraiment des ___.", w:"OUTIL", a:"outils", t:"Множественное число существительных"},
    {s:"Tout ___ en temps.", w:"RÉGLER", a:"réglé", t:"Пассивный залог"},
    {s:"Tout ce que vous ___.", w:"FAIRE", a:"faites", t:"Спряжение в présent"},
    {s:"Viens de ___ ma formation.", w:"TERMINER", a:"terminer", t:"Инфинитив после предлога"},
    {s:"Grâce à ___ formation.", w:"CE", a:"cette", t:"Местоимения и детерминативы"},
    {s:"Tout ce que j'___.", w:"APPRENDRE", a:"ai appris", t:"Passé composé"},
    {s:"Pleine ou nouvelle lune.", w:"PLEIN", a:"pleine", t:"Согласование прилагательных"},
    {s:"Fabriquent et ___.", w:"INSTALLER", a:"installent", t:"Спряжение в présent"},
    {s:"Ils sont ___ pour l'équilibre.", w:"ESSENTIEL", a:"essentiels", t:"Согласование прилагательных"},
    {s:"Petits ___ indispensables.", w:"JARDINIER", a:"jardiniers", t:"Множественное число существительных"},
    {s:"En ___ leur corps.", w:"BOUGER", a:"bougeant", t:"Инфинитив после предлога"},
    {s:"Façade ___.", w:"MONUMENT", a:"monumentale", t:"Словообразование (другие части речи)"},
    {s:"Vraiment ___.", w:"REMARQUER", a:"remarquable", t:"Словообразование (другие части речи)"},
    {s:"Sa ___ est splendide.", w:"DÉCORER", a:"décoration", t:"Отглагольные существительные"},
    {s:"Faire des ___ de décors.", w:"CHANGER", a:"changements", t:"Отглагольные существительные"},
    {s:"Couleurs vives et ___.", w:"NATURE", a:"naturelles", t:"Согласование прилагательных"},
    {s:"Sont ___ décorées.", w:"RICHE", a:"richement", t:"Наречия на -ment"},
    {s:"Tâches ___.", w:"RÉPÉTITIF", a:"répétitives", t:"Согласование прилагательных"},
    {s:"Robots ___ les marées noires.", w:"NETTOYER", a:"nettoient", t:"Спряжение в présent"},
    {s:"Robots ___ trois millions d'emplois.", w:"MENACER", a:"menacent", t:"Спряжение в présent"},
    {s:"Bottes qui ___ en peau.", w:"FABRIQUER", a:"sont fabriquées", t:"Пассивный залог"},
    {s:"___ bottes sont indispensables.", w:"CE", a:"ces", t:"Местоимения и детерминативы"},
    {s:"Zaytsev ___ la doublionka.", w:"INTRODUIRE", a:"a introduit", t:"Passé composé"},
    {s:"Grandes ___.", w:"MARQUE", a:"marques", t:"Множественное число существительных"},
    {s:"Monuments ___.", w:"PRINCIPAL", a:"principaux", t:"Согласование прилагательных"},
    {s:"S'associent et ___ au monde.", w:"METTRE", a:"mettent", t:"Спряжение в présent"}
  ];

  TASKS.forEach(function(t, i){ t.id = i; });

  // список тем, в порядке появления
  var THEME_ORDER = [];
  TASKS.forEach(function(t){
    if (THEME_ORDER.indexOf(t.t) === -1) THEME_ORDER.push(t.t);
  });
  var themeSelect = document.getElementById('themeFilter');
  THEME_ORDER.forEach(function(th){
    var count = TASKS.filter(function(t){ return t.t === th; }).length;
    var opt = document.createElement('option');
    opt.value = th;
    opt.textContent = th + ' (' + count + ')';
    themeSelect.appendChild(opt);
  });

  // ---------- Состояние ----------
  var queue = [];
  var current = null;
  var totalAnswered = 0;
  var correctFirstTry = 0;
  var mistakesByTheme = {};
  var awaitingNext = false;
  var activePool = TASKS;

  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function normalize(str){
    return str
      .trim()
      .toLowerCase()
      .replace(/['’ʼ]/g, "'")
      .replace(/\s+/g, ' ');
  }

  function byTheme(theme, excludeId){
    return TASKS.filter(function(t){ return t.t === theme && t.id !== excludeId; });
  }

  function startSession(pool){
    activePool = pool;
    queue = shuffle(pool);
    totalAnswered = 0;
    correctFirstTry = 0;
    mistakesByTheme = {};
    document.getElementById('summaryArea').style.display = 'none';
    document.getElementById('quizArea').style.display = 'block';
    document.getElementById('setupRow').style.display = 'flex';
    nextQuestion();
  }

  function totalPlanned(){
    return totalAnswered + queue.length + (current ? 1 : 0);
  }

  function updateStats(){
    document.getElementById('statsLine').textContent =
      totalAnswered + ' / ' + totalPlanned() + ' · верно ' + correctFirstTry;
    var pct = totalPlanned() > 0 ? Math.round((totalAnswered / totalPlanned()) * 100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
  }

  function nextQuestion(){
    awaitingNext = false;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').innerHTML = '';
    document.getElementById('nextRow').className = 'next-row';
    document.getElementById('answerForm').style.display = 'flex';

    if (queue.length === 0){
      finishSession();
      return;
    }
    current = queue.shift();
    document.getElementById('themeTag').textContent = current.t;
    document.getElementById('sentenceText').innerHTML = current.s.replace('___', '<span class="blank">&nbsp;</span>');
    document.getElementById('givenWord').textContent = current.w;
    var input = document.getElementById('answerInput');
    input.value = '';
    updateStats();
    setTimeout(function(){ input.focus({preventScroll:true}); }, 50);
  }

  function finishSession(){
    current = null;
    document.getElementById('quizArea').style.display = 'none';
    document.getElementById('setupRow').style.display = 'none';
    var summary = document.getElementById('summaryArea');
    summary.style.display = 'block';
    document.getElementById('scoreText').textContent = correctFirstTry + ' / ' + totalAnswered;

    var themes = Object.keys(mistakesByTheme).sort(function(a,b){
      return mistakesByTheme[b] - mistakesByTheme[a];
    });
    var weakDiv = document.getElementById('weakThemes');
    if (themes.length === 0){
      weakDiv.innerHTML = '<p>Ни одной ошибки — отличный результат!</p>';
    } else {
      var html = '<p>Темы, где были ошибки:</p><ul>';
      themes.forEach(function(th){
        html += '<li>' + th + ' — ошибок: ' + mistakesByTheme[th] + '</li>';
      });
      html += '</ul>';
      weakDiv.innerHTML = html;
    }

    window._lastWeakThemes = themes;
    updateStats();
  }

  function submitAnswer(){
    if (!current || awaitingNext) return;
    var input = document.getElementById('answerInput');
    var val = normalize(input.value);
    var correct = normalize(current.a);
    var fb = document.getElementById('feedback');
    totalAnswered++;

    if (val.length > 0 && val === correct){
      correctFirstTry++;
      fb.className = 'feedback correct show';
      fb.innerHTML = 'Верно — <strong>' + current.a + '</strong>.';
    } else {
      mistakesByTheme[current.t] = (mistakesByTheme[current.t] || 0) + 1;
      fb.className = 'feedback wrong show';
      fb.innerHTML = 'Правильный ответ: <strong>' + current.a + '</strong>.' +
        '<span class="margin-note">Тема «' + current.t + '» — добавляю ещё задания на отработку.</span>';

      var extra = shuffle(byTheme(current.t, current.id)).slice(0, 2);
      if (extra.length === 0){
        extra = [current];
      }
      var insertAt = Math.min(1, queue.length);
      queue.splice.apply(queue, [insertAt, 0].concat(extra));
    }

    document.getElementById('answerForm').style.display = 'none';
    document.getElementById('nextRow').className = 'next-row show';
    awaitingNext = true;
    updateStats();
    setTimeout(function(){ document.getElementById('nextBtn').focus({preventScroll:true}); }, 30);
  }

  document.getElementById('answerForm').addEventListener('submit', function(e){
    e.preventDefault();
    submitAnswer();
  });

  document.getElementById('nextBtn').addEventListener('click', function(){
    nextQuestion();
  });

  document.getElementById('restartAllBtn').addEventListener('click', function(){
    themeSelect.value = '';
    startSession(TASKS);
  });

  document.getElementById('restartWeakBtn').addEventListener('click', function(){
    var themes = window._lastWeakThemes || [];
    if (themes.length === 0){
      startSession(TASKS);
      return;
    }
    var pool = TASKS.filter(function(t){ return themes.indexOf(t.t) !== -1; });
    startSession(pool);
  });

  themeSelect.addEventListener('change', function(){
    var val = themeSelect.value;
    var pool = val ? TASKS.filter(function(t){ return t.t === val; }) : TASKS;
    startSession(pool);
  });

  // старт
  startSession(TASKS);

})();
</script>
</body>
</html>
